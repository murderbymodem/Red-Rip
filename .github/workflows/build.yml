name: Build

# Every push / pull request: run tests and build the .exe (downloadable as a workflow artifact).
# Publishing a release on GitHub (Releases -> Draft a new release, tag like v0.1.0): the same
# build runs for that tag and attaches the .exe and its checksum to the release.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed only to attach files to a published release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Check tag matches app version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = python -c "from ytdlsub_win_gui import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.event.release.tag_name }}") {
            Write-Error "Release tag ${{ github.event.release.tag_name }} does not match __version__ $version in ytdlsub_win_gui/__init__.py (expected v$version)"
            exit 1
          }

      - name: Build .exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ytdl-sub-win-gui launcher.py

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $p = Start-Process dist\ytdl-sub-win-gui.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "--version exited with $($p.ExitCode)"; exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\ytdl-sub-win-gui.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ytdl-sub-win-gui.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ytdl-sub-win-gui
          path: |
            dist/ytdl-sub-win-gui.exe
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:TAG" dist/ytdl-sub-win-gui.exe dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
          $sum = (Get-Content dist\SHA256SUMS.txt).Split(" ")[0]
          $body = gh release view "$env:TAG" --json body --jq .body --repo "${{ github.repository }}"
          $extra = "`n`n---`nSHA-256 of ytdl-sub-win-gui.exe: ``$sum```nBuilt by GitHub Actions from ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Set-Content -Path notes.md -Value (($body -join "`n") + $extra) -Encoding utf8
          gh release edit "$env:TAG" --notes-file notes.md --repo "${{ github.repository }}"
