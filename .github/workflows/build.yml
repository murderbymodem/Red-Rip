name: Build

# Every push / pull request: run tests and build the .exe (downloadable as a workflow artifact).
# Publishing a release on GitHub (Releases -> Draft a new release, tag like v0.1.0): the same
# build runs for that tag and attaches the .exe and its checksum to the release.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed only to attach files to a published release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Set app version from release tag
        if: github.event_name == 'release'
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The release tag is the version: "v0.1.2" and "0.1.2" both mean 0.1.2.
          # It's written into the app before building, so nobody edits a version by hand.
          $version = $env:TAG -replace '^[vV]', ''
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            Write-Error "Release tag '$env:TAG' isn't a version number. Use something like v0.1.2."
            exit 1
          }
          "__version__ = `"$version`"" | Out-File -Encoding utf8NoBOM redrip\__init__.py
          Get-Content redrip\__init__.py

      - name: Build .exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Red-Rip --icon assets/icon.ico --add-data "assets/icon.ico:assets" launcher.py

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $p = Start-Process dist\Red-Rip.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "--version exited with $($p.ExitCode)"; exit 1 }

      - name: Package zip
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Zip contains one top-level folder, so extracting always gives the app its own folder
          # (it creates its data folder next to the .exe).
          $suffix = if ($env:TAG) { $env:TAG } else { "${{ github.sha }}".Substring(0, 7) }
          $zipName = "Red-Rip-$suffix.zip"
          $folder = "package\Red-Rip"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item dist\Red-Rip.exe, LICENSE, README.md $folder
          Compress-Archive -Path $folder -DestinationPath "dist\$zipName" -Force
          # Verify the layout: Red-Rip\Red-Rip.exe at the top of the zip
          Expand-Archive "dist\$zipName" -DestinationPath check -Force
          if (-not (Test-Path "check\Red-Rip\Red-Rip.exe")) { Write-Error "unexpected zip layout"; exit 1 }
          "ZIP_NAME=$zipName" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Checksum
        shell: pwsh
        run: |
          $lines = foreach ($f in @("dist\$env:ZIP_NAME", "dist\Red-Rip.exe")) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          $lines | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Red-Rip
          path: |
            dist/${{ env.ZIP_NAME }}
            dist/SHA256SUMS.txt

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:TAG" "dist/$env:ZIP_NAME" dist/SHA256SUMS.txt --clobber --repo "${{ github.repository }}"
          $zipSum = (Get-Content dist\SHA256SUMS.txt | Select-Object -First 1).Split(" ")[0]
          $body = gh release view "$env:TAG" --json body --jq .body --repo "${{ github.repository }}"
          $extra = "`n`n---`nDownload **$env:ZIP_NAME**, extract it, and run ``Red-Rip\Red-Rip.exe``.`n`nSHA-256 of $($env:ZIP_NAME): ``$zipSum`` (the .exe's checksum is in SHA256SUMS.txt)`nBuilt by GitHub Actions from ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Set-Content -Path notes.md -Value (($body -join "`n") + $extra) -Encoding utf8
          gh release edit "$env:TAG" --notes-file notes.md --repo "${{ github.repository }}"
