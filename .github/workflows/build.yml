name: Build

# Every push / pull request: run tests and build the .exe (downloadable as a workflow artifact).
# Pushing a tag like v0.1.0: also publish a GitHub release with the .exe and its checksum.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # needed only to create the release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "from ytdlsub_win_gui import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match __version__ $version in ytdlsub_win_gui/__init__.py"
            exit 1
          }

      - name: Build .exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ytdl-sub-win-gui launcher.py

      - name: Smoke test the .exe
        shell: pwsh
        run: |
          $p = Start-Process dist\ytdl-sub-win-gui.exe -ArgumentList "--version" -PassThru -Wait
          if ($p.ExitCode -ne 0) { Write-Error "--version exited with $($p.ExitCode)"; exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\ytdl-sub-win-gui.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ytdl-sub-win-gui.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ytdl-sub-win-gui
          path: |
            dist/ytdl-sub-win-gui.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sum = Get-Content dist\SHA256SUMS.txt
          $notes = "Download ytdl-sub-win-gui.exe below.`n`nSHA-256: ``$sum```n`nBuilt by GitHub Actions from ${{ github.sha }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh release create "${{ github.ref_name }}" dist/ytdl-sub-win-gui.exe dist/SHA256SUMS.txt --title "${{ github.ref_name }}" --notes "$notes" --generate-notes
